<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Admin Dashboard</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="students.html" class="nav-link active">Students</a></li>
                <li><a href="professors.html" class="nav-link">Professors</a></li>
                <li><a href="assignments.html" class="nav-link">Course Assignments</a></li>
                <li><a href="users.html" class="nav-link">Users</a></li>
                <li><a href="#" class="nav-link" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Manage Students</h2>
                <button class="btn btn-primary" onclick="showAddStudentModal()">Add Student</button>
            </div>

            <div id="studentsTable" class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add New Student</h3>
                <button class="modal-close" onclick="closeModal('addStudentModal')">×</button>
            </div>
            <form id="addStudentForm">
                <div class="form-group">
                    <label class="form-label">Matricule <span class="required">*</span></label>
                    <input type="text" name="matricule" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" name="fullname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Group</label>
                    <select name="group_id" class="form-control" id="groupSelect">
                        <option value="">Select Group</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Username <span class="required">*</span></label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addStudentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Student Modal -->
    <div class="modal" id="editStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Student</h3>
                <button class="modal-close" onclick="closeModal('editStudentModal')">×</button>
            </div>
            <form id="editStudentForm">
                <input type="hidden" name="id" id="editStudentId">
                <div class="form-group">
                    <label class="form-label">Matricule <span class="required">*</span></label>
                    <input type="text" name="matricule" id="editMatricule" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" name="fullname" id="editFullname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" id="editEmail" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Group</label>
                    <select name="group_id" class="form-control" id="editGroupSelect">
                        <option value="">Select Group</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Username <span class="required">*</span></label>
                    <input type="text" name="username" id="editUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="password" id="editPassword" class="form-control" placeholder="Leave blank to keep current password">
                    <small style="color: var(--text-secondary); font-size: 0.875rem;">Only fill this if you want to change the password</small>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('editStudentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Student</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        if (!requireAuth('admin')) {}

        let groups = [];

        async function loadGroups() {
            try {
                const result = await apiCall('groups.php');
                groups = result.data;
                const select = document.getElementById('groupSelect');
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group.id;
                    option.textContent = `${group.group_code} - ${group.group_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        async function loadStudents() {
            const tableDiv = document.getElementById('studentsTable');
            tableDiv.innerHTML = '<div class="spinner"></div>';

            try {
                const result = await apiCall('students.php');
                const students = result.data;

                if (students.length === 0) {
                    tableDiv.innerHTML = '<p>No students found.</p>';
                    return;
                }

                let html = '<div class="table-container"><table class="table"><thead><tr>';
                html += '<th>Matricule</th><th>Full Name</th><th>Email</th><th>Group</th><th>Username</th><th>Actions</th>';
                html += '</tr></thead><tbody>';

                students.forEach(student => {
                    html += `<tr>
                        <td>${escapeHtml(student.matricule)}</td>
                        <td>${escapeHtml(student.fullname)}</td>
                        <td>${escapeHtml(student.email || '')}</td>
                        <td>${escapeHtml(student.group_code || 'N/A')}</td>
                        <td>${escapeHtml(student.username || '')}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editStudent(${student.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                tableDiv.innerHTML = html;
            } catch (error) {
                tableDiv.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                await apiCall(`students.php?id=${id}`, 'DELETE');
                showAlert('Student deleted successfully');
                loadStudents();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        function showAddStudentModal() {
            loadGroups();
            showModal('addStudentModal');
        }

        async function editStudent(id) {
            try {
                // Ensure groups are loaded
                if (groups.length === 0) {
                    await loadGroups();
                }
                
                const result = await apiCall(`students.php?id=${id}`);
                const student = result.data;
                
                if (!student) {
                    showAlert('Student not found', 'error');
                    return;
                }

                // Populate edit form
                document.getElementById('editStudentId').value = student.id;
                document.getElementById('editMatricule').value = student.matricule || '';
                document.getElementById('editFullname').value = student.fullname || '';
                document.getElementById('editEmail').value = student.email || '';
                document.getElementById('editUsername').value = student.username || '';
                document.getElementById('editPassword').value = '';
                
                // Load groups for edit modal
                const editGroupSelect = document.getElementById('editGroupSelect');
                editGroupSelect.innerHTML = '<option value="">Select Group</option>';
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group.id;
                    option.textContent = `${group.group_code} - ${group.group_name}`;
                    if (student.group_id == group.id) {
                        option.selected = true;
                    }
                    editGroupSelect.appendChild(option);
                });
                
                showModal('editStudentModal');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        document.getElementById('editStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Remove password if empty
            if (!data.password) {
                delete data.password;
            }

            try {
                await apiCall('students.php', 'PUT', data);
                showAlert('Student updated successfully');
                closeModal('editStudentModal');
                this.reset();
                loadStudents();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        document.getElementById('addStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            try {
                await apiCall('students.php', 'POST', data);
                showAlert('Student added successfully');
                closeModal('addStudentModal');
                this.reset();
                loadStudents();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        loadStudents();
        loadGroups();
    </script>
</body>
</html>
