<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Student Dashboard</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="attendance.html" class="nav-link active">My Attendance</a></li>
                <li><a href="#" class="nav-link" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">My Attendance Records</h2>
            </div>

            <div id="attendanceList" class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Justification Modal -->
    <div class="modal" id="justificationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Submit Justification</h3>
                <button class="modal-close" onclick="closeModal('justificationModal')">×</button>
            </div>
            <form id="justificationForm">
                <input type="hidden" id="justSessionId" name="session_id">
                <div class="form-group">
                    <label class="form-label">Justification Text</label>
                    <textarea name="justification" id="justificationText" class="form-control" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Upload PDF Justification</label>
                    <div class="file-upload" onclick="document.getElementById('pdfFile').click()">
                        <input type="file" id="pdfFile" name="pdf" accept=".pdf" onchange="handleFileSelect(this)">
                        <p>Click to upload PDF file</p>
                        <p id="fileName" style="color: var(--text-secondary); font-size: 0.875rem;"></p>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('justificationModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        if (!requireAuth('student')) {}

        const user = getCurrentUser();
        let selectedSessionId = null;

        async function loadAttendance() {
            const listDiv = document.getElementById('attendanceList');
            listDiv.innerHTML = '<div class="spinner"></div>';

            try {
                const result = await apiCall(`attendance.php?student_id=${user.profile_id}`);
                const records = result.data || [];

                if (records.length === 0) {
                    listDiv.innerHTML = '<p>No attendance records found.</p>';
                    return;
                }

                let html = '<div class="table-container"><table class="table"><thead><tr>';
                html += '<th>Date</th><th>Course</th><th>Group</th><th>Status</th><th>Justification</th><th>Actions</th>';
                html += '</tr></thead><tbody>';

                records.forEach(record => {
                    const statusClass = record.status === 'present' ? 'badge-success' : 
                                      record.status === 'justified' ? 'badge-warning' : 'badge-danger';
                    
                    html += `<tr>
                        <td>${formatDate(record.session_date)}</td>
                        <td>${escapeHtml(record.course_code)} - ${escapeHtml(record.course_name)}</td>
                        <td>${escapeHtml(record.group_code)}</td>
                        <td><span class="badge ${statusClass}">${escapeHtml(record.status)}</span></td>
                        <td>${record.justification ? escapeHtml(record.justification.substring(0, 50)) + '...' : 'N/A'}</td>
                        <td>
                            ${record.status === 'absent' ? `<button class="btn btn-primary btn-sm" onclick="showJustificationModal(${record.session_id})">Justify</button>` : ''}
                            ${record.justification_pdf ? `<a href="../../uploads/${escapeHtml(record.justification_pdf)}" target="_blank" class="btn btn-secondary btn-sm">View PDF</a>` : ''}
                        </td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                listDiv.innerHTML = html;
            } catch (error) {
                listDiv.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
            }
        }

        function showJustificationModal(sessionId) {
            selectedSessionId = sessionId;
            document.getElementById('justSessionId').value = sessionId;
            showModal('justificationModal');
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileName').textContent = input.files[0].name;
            }
        }

        document.getElementById('justificationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const pdfFile = document.getElementById('pdfFile').files[0];
            
            let justification = formData.get('justification');
            let justificationPdf = null;

            // Upload PDF if provided
            if (pdfFile) {
                try {
                    const uploadFormData = new FormData();
                    uploadFormData.append('file', pdfFile);
                    
                    const uploadResponse = await fetch(API_BASE + 'upload.php', {
                        method: 'POST',
                        body: uploadFormData
                    });
                    
                    const uploadResult = await uploadResponse.json();
                    if (uploadResult.success) {
                        justificationPdf = uploadResult.filename;
                    } else {
                        throw new Error(uploadResult.error || 'Upload failed');
                    }
                } catch (error) {
                    showAlert('Error uploading PDF: ' + error.message, 'error');
                    return;
                }
            }

            // Submit justification
            try {
                await apiCall('attendance.php', 'PUT', {
                    session_id: selectedSessionId,
                    student_id: user.profile_id,
                    justification: justification || null,
                    justification_pdf: justificationPdf
                });
                
                showAlert('Justification submitted successfully');
                closeModal('justificationModal');
                this.reset();
                document.getElementById('fileName').textContent = '';
                loadAttendance();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        loadAttendance();
    </script>
</body>
</html>
