<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance System</title>
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 5rem auto;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #2e7d32;
        }
        .role-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #66BB6A;
            background: white;
            color: #2e7d32;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .role-btn.active {
            background: #66BB6A;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System</h1>
        </div>
    </nav>

    <main class="container">
        <div class="login-container">
            <div class="login-card">
                <h2 class="login-title">Login</h2>
                
                <div id="message" class="message" style="display: none;"></div>
                
                <div class="role-selector">
                    <button class="role-btn active" onclick="selectRole('student')">Student</button>
                    <button class="role-btn" onclick="selectRole('professor')">Professor</button>
                    <button class="role-btn" onclick="selectRole('admin')">Admin</button>
                </div>
                
                <form id="loginForm">
                    <input type="hidden" id="role" value="student">
                    
                    <div class="form-group">
                        <label for="username">Username <span class="required">*</span></label>
                        <input type="text" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/common.js"></script>
    <script>
        function selectRole(role) {
            document.getElementById('role').value = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;
            
            if (!username || !password) {
                showMessage('Please enter username and password', 'error');
                return;
            }
            
            try {
                const result = await apiCall('auth.php', 'POST', {
                    username: username,
                    password: password,
                    role: role
                });
                
                if (result.success) {
                    // Store user info in sessionStorage
                    sessionStorage.setItem('user_id', result.data.user_id);
                    sessionStorage.setItem('username', result.data.username);
                    sessionStorage.setItem('role', result.data.role);
                    sessionStorage.setItem('fullname', result.data.fullname);
                    
                    // Redirect based on role
                    if (result.data.role === 'student') {
                        window.location.href = 'pages/student/home.html';
                    } else if (result.data.role === 'professor') {
                        window.location.href = 'pages/professor/home.html';
                    } else if (result.data.role === 'admin') {
                        window.location.href = 'pages/admin/home.html';
                    }
                } else {
                    showMessage(result.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Login error: ' + error.message, 'error');
            }
        });
        
        // Override API_BASE for login page (root level)
        window.API_BASE = 'api/';
    </script>
</body>
</html>
