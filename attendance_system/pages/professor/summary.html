<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Summary - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Professor</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="summary.html" class="nav-link active">Summary</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Attendance Summary</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div class="form-group">
                <label for="courseSelect">Select Course:</label>
                <select id="courseSelect" class="form-group">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="groupSelect">Select Group:</label>
                <select id="groupSelect" class="form-group">
                    <option value="">Select course first</option>
                </select>
            </div>
            
            <div id="loading" class="loading" style="display: none;">Loading summary...</div>
            <div id="summaryContainer"></div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('professor')) {
            // Redirect will happen in requireLogin
        }
        
        const PROFESSOR_ID = getUserId();
        let courses = [];
        let groups = [];
        
        async function loadCourses() {
            try {
                const result = await apiCall(`sessions.php?professor_id=${PROFESSOR_ID}`);
                courses = result.data;
                
                const select = document.getElementById('courseSelect');
                select.innerHTML = '<option value="">Select a course</option>';
                
                courses.forEach(course => {
                    const option = document.createElement('option');
                    option.value = course.course_id;
                    option.textContent = `${course.course_code} - ${course.course_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                showMessage('Error loading courses: ' + error.message, 'error');
            }
        }
        
        async function loadGroups() {
            try {
                const result = await apiCall('groups.php');
                groups = result.data;
                
                const courseId = document.getElementById('courseSelect').value;
                if (!courseId) {
                    document.getElementById('groupSelect').innerHTML = '<option value="">Select course first</option>';
                    return;
                }
                
                const course = courses.find(c => c.course_id == courseId);
                if (!course) return;
                
                const select = document.getElementById('groupSelect');
                select.innerHTML = '<option value="">Select a group</option>';
                
                const courseGroups = [...new Set(course.sessions.map(s => s.group_id))];
                courseGroups.forEach(groupId => {
                    const group = groups.find(g => g.id == groupId);
                    if (group) {
                        const option = document.createElement('option');
                        option.value = group.id;
                        option.textContent = `${group.group_code} - ${group.group_name}`;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                showMessage('Error loading groups: ' + error.message, 'error');
            }
        }
        
        async function loadSummary() {
            const courseId = document.getElementById('courseSelect').value;
            const groupId = document.getElementById('groupSelect').value;
            
            if (!courseId || !groupId) {
                document.getElementById('summaryContainer').innerHTML = '';
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const result = await apiCall(`attendance.php?course_id=${courseId}&group_id=${groupId}`);
                const summary = result.data;
                
                if (summary.length === 0) {
                    document.getElementById('summaryContainer').innerHTML = 
                        '<p>No attendance records found for this course/group.</p>';
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                let html = `
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Total Students</th>
                                    <th>Present</th>
                                    <th>Absent</th>
                                    <th>Justified</th>
                                    <th>Attendance Rate</th>
                                </tr>
                            </thead>
                            <tbody>`;
                
                summary.forEach(session => {
                    const total = parseInt(session.total_students) || 0;
                    const present = parseInt(session.present_count) || 0;
                    const absent = parseInt(session.absent_count) || 0;
                    const justified = parseInt(session.justified_count) || 0;
                    const rate = total > 0 ? ((present / total) * 100).toFixed(1) : 0;
                    
                    html += `
                        <tr>
                            <td>${formatDate(session.session_date)}</td>
                            <td>${total}</td>
                            <td>${present}</td>
                            <td>${absent}</td>
                            <td>${justified}</td>
                            <td>${rate}%</td>
                        </tr>`;
                });
                
                html += '</tbody></table></div>';
                document.getElementById('summaryContainer').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading summary: ' + error.message, 'error');
            }
        }
        
        document.getElementById('courseSelect').addEventListener('change', function() {
            loadGroups();
            document.getElementById('summaryContainer').innerHTML = '';
        });
        
        document.getElementById('groupSelect').addEventListener('change', loadSummary);
        
        document.addEventListener('DOMContentLoaded', loadCourses);
    </script>
</body>
</html>
