<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Professor</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="summary.html" class="nav-link">Summary</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Mark Attendance</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div id="sessionInfo" class="card" style="margin-bottom: 1.5rem;"></div>
            
            <div id="loading" class="loading">Loading students...</div>
            <div id="attendanceForm" style="display: none;">
                <form id="markAttendanceForm">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Matricule</th>
                                    <th>Full Name</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="studentsList"></tbody>
                        </table>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Attendance</button>
                    <a href="home.html" class="btn btn-secondary">Back to Home</a>
                </form>
            </div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('professor')) {
            // Redirect will happen in requireLogin
        }
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('id');
        let sessionData = null;
        let students = [];
        
        async function loadSession() {
            if (!sessionId) {
                showMessage('Invalid session ID', 'error');
                return;
            }
            
            try {
                // Load session details
                const sessionResult = await apiCall(`sessions.php?id=${sessionId}`);
                sessionData = sessionResult.data;
                
                // Display session info
                document.getElementById('sessionInfo').innerHTML = `
                    <h3>${escapeHtml(sessionData.course_code)} - ${escapeHtml(sessionData.course_name)}</h3>
                    <p><strong>Group:</strong> ${escapeHtml(sessionData.group_code)}</p>
                    <p><strong>Date:</strong> ${formatDate(sessionData.session_date)}</p>
                    <p><strong>Status:</strong> <span class="status-badge ${sessionData.status === 'open' ? 'status-open' : 'status-closed'}">${sessionData.status.toUpperCase()}</span></p>
                `;
                
                // Load students for this course/group
                const studentsResult = await apiCall(`students.php?course_id=${sessionData.course_id}&group_id=${sessionData.group_id}`);
                students = studentsResult.data;
                
                // Load existing attendance records
                const existingRecords = {};
                if (sessionData.attendance_records) {
                    sessionData.attendance_records.forEach(record => {
                        existingRecords[record.student_id] = record;
                    });
                }
                
                // Build form
                let html = '';
                students.forEach(student => {
                    const record = existingRecords[student.id];
                    const status = record ? record.status : 'absent';
                    
                    html += `
                        <tr>
                            <td>${escapeHtml(student.matricule)}</td>
                            <td>${escapeHtml(student.fullname)}</td>
                            <td>
                                <select name="attendance[${student.id}]" class="form-group" style="width: auto; padding: 0.5rem;">
                                    <option value="present" ${status === 'present' ? 'selected' : ''}>Present</option>
                                    <option value="absent" ${status === 'absent' ? 'selected' : ''}>Absent</option>
                                    <option value="justified" ${status === 'justified' ? 'selected' : ''}>Justified</option>
                                </select>
                            </td>
                        </tr>`;
                });
                
                document.getElementById('studentsList').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('attendanceForm').style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading session: ' + error.message, 'error');
            }
        }
        
        document.getElementById('markAttendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (sessionData.status === 'closed') {
                showMessage('Cannot modify attendance for a closed session', 'error');
                return;
            }
            
            const formData = new FormData(this);
            const attendance = [];
            
            for (const [key, value] of formData.entries()) {
                if (key.startsWith('attendance[')) {
                    const studentId = parseInt(key.match(/\[(\d+)\]/)[1]);
                    attendance.push({
                        student_id: studentId,
                        status: value
                    });
                }
            }
            
            try {
                await apiCall('attendance.php', 'POST', {
                    session_id: parseInt(sessionId),
                    attendance: attendance
                });
                
                showMessage('Attendance saved successfully!');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            } catch (error) {
                showMessage('Error saving attendance: ' + error.message, 'error');
            }
        });
        
        document.addEventListener('DOMContentLoaded', loadSession);
    </script>
</body>
</html>
