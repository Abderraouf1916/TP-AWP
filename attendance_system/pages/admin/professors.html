<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Management - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Admin</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="register.html" class="nav-link">Register Users</a></li>
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="professors.html" class="nav-link active">Professors</a></li>
                <li><a href="statistics.html" class="nav-link">Statistics</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Professor Management</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div style="margin-bottom: 2rem;">
                <a href="register.html" class="btn btn-primary">Register New Professor</a>
            </div>
            
            <div id="loading" class="loading">Loading professors...</div>
            <div id="professorsTable" style="display: none;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Professor Code</th>
                                <th>Full Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="professorsList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
            <h3>Edit Professor</h3>
            <form id="editProfessorForm">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label for="edit_fullname">Full Name <span class="required">*</span></label>
                    <input type="text" id="edit_fullname" required>
                </div>
                <div class="form-group">
                    <label for="edit_email">Email</label>
                    <input type="email" id="edit_email">
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('admin')) {
            // Redirect will happen in requireLogin
        }
        
        async function loadProfessors() {
            try {
                const result = await apiCall('professors.php');
                const professors = result.data;
                
                document.getElementById('loading').style.display = 'none';
                
                if (professors.length === 0) {
                    document.getElementById('professorsTable').innerHTML = '<p>No professors found. Register a new professor to get started.</p>';
                    return;
                }
                
                let html = '';
                professors.forEach(professor => {
                    html += `
                        <tr>
                            <td>${professor.id}</td>
                            <td>${escapeHtml(professor.professor_code)}</td>
                            <td>${escapeHtml(professor.fullname)}</td>
                            <td>${escapeHtml(professor.username)}</td>
                            <td>${escapeHtml(professor.email || '-')}</td>
                            <td>
                                <button class="btn btn-primary" onclick="editProfessor(${professor.id})">Edit</button>
                                <button class="btn btn-danger" onclick="deleteProfessor(${professor.id})">Delete</button>
                            </td>
                        </tr>`;
                });
                
                document.getElementById('professorsList').innerHTML = html;
                document.getElementById('professorsTable').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading professors: ' + error.message, 'error');
            }
        }
        
        async function editProfessor(id) {
            try {
                const result = await apiCall(`professors.php?id=${id}`);
                const professor = result.data;
                
                document.getElementById('edit_id').value = professor.id;
                document.getElementById('edit_fullname').value = professor.fullname;
                document.getElementById('edit_email').value = professor.email || '';
                document.getElementById('editModal').style.display = 'block';
            } catch (error) {
                showMessage('Error loading professor: ' + error.message, 'error');
            }
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function deleteProfessor(id) {
            if (!confirm('Are you sure you want to delete this professor?')) return;
            
            try {
                await apiCall(`professors.php?id=${id}`, 'DELETE');
                showMessage('Professor deleted successfully');
                loadProfessors();
            } catch (error) {
                showMessage('Error deleting professor: ' + error.message, 'error');
            }
        }
        
        document.getElementById('editProfessorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                id: parseInt(document.getElementById('edit_id').value),
                fullname: document.getElementById('edit_fullname').value.trim(),
                email: document.getElementById('edit_email').value.trim()
            };
            
            try {
                await apiCall('professors.php', 'PUT', data);
                showMessage('Professor updated successfully');
                closeEditModal();
                loadProfessors();
            } catch (error) {
                showMessage('Error updating professor: ' + error.message, 'error');
            }
        });
        
        document.addEventListener('DOMContentLoaded', loadProfessors);
    </script>
</body>
</html>
