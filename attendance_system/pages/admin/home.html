<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Home - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Admin</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link active">Home</a></li>
                <li><a href="register.html" class="nav-link">Register Users</a></li>
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="professors.html" class="nav-link">Professors</a></li>
                <li><a href="statistics.html" class="nav-link">Statistics</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Admin Dashboard</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div id="loading" class="loading">Loading statistics...</div>
            <div id="dashboard" class="grid grid-3" style="display: none;"></div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('admin')) {
            // Redirect will happen in requireLogin
        }
        async function loadDashboard() {
            try {
                const result = await apiCall('statistics.php');
                const stats = result.data;
                
                document.getElementById('loading').style.display = 'none';
                
                const html = `
                    <div class="stats-card">
                        <div class="stats-label">Total Students</div>
                        <div class="stats-value">${stats.total_students}</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">Total Courses</div>
                        <div class="stats-value">${stats.total_courses}</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">Total Sessions</div>
                        <div class="stats-value">${stats.total_sessions}</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">Attendance Rate</div>
                        <div class="stats-value">${stats.attendance_rate}%</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">Present</div>
                        <div class="stats-value">${stats.attendance.present || 0}</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">Absent</div>
                        <div class="stats-value">${stats.attendance.absent || 0}</div>
                    </div>
                `;
                
                document.getElementById('dashboard').innerHTML = html;
                document.getElementById('dashboard').style.display = 'grid';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading dashboard: ' + error.message, 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
