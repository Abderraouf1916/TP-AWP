<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Users - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Admin</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="register.html" class="nav-link active">Register Users</a></li>
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="professors.html" class="nav-link">Professors</a></li>
                <li><a href="statistics.html" class="nav-link">Statistics</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Register New User</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>User Type:</label>
                <div style="display: flex; gap: 1rem;">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="radio" name="userType" value="student" checked style="margin-right: 0.5rem;">
                        Student
                    </label>
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="radio" name="userType" value="professor" style="margin-right: 0.5rem;">
                        Professor
                    </label>
                </div>
            </div>
            
            <form id="registerForm" class="student-form">
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" required>
                </div>
                
                <div class="form-group">
                    <label for="fullname">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullname" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
                
                <!-- Student specific fields -->
                <div id="studentFields">
                    <div class="form-group">
                        <label for="matricule">Matricule <span class="required">*</span></label>
                        <input type="text" id="matricule">
                    </div>
                    <div class="form-group">
                        <label for="studentGroup">Group</label>
                        <select id="studentGroup">
                            <option value="">Select Group</option>
                        </select>
                    </div>
                </div>
                
                <!-- Professor specific fields -->
                <div id="professorFields" style="display: none;">
                    <div class="form-group">
                        <label for="professorCode">Professor Code <span class="required">*</span></label>
                        <input type="text" id="professorCode">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Register User</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </form>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('admin')) {
            // Redirect will happen in requireLogin
        }
        
        let groups = [];
        
        // Load groups for student registration
        async function loadGroups() {
            try {
                const result = await apiCall('groups.php');
                groups = result.data;
                
                const select = document.getElementById('studentGroup');
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group.id;
                    option.textContent = `${group.group_code} - ${group.group_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }
        
        // Toggle fields based on user type
        document.querySelectorAll('input[name="userType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'student') {
                    document.getElementById('studentFields').style.display = 'block';
                    document.getElementById('professorFields').style.display = 'none';
                    document.getElementById('matricule').required = true;
                    document.getElementById('professorCode').required = false;
                } else {
                    document.getElementById('studentFields').style.display = 'none';
                    document.getElementById('professorFields').style.display = 'block';
                    document.getElementById('matricule').required = false;
                    document.getElementById('professorCode').required = true;
                }
            });
        });
        
        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userType = document.querySelector('input[name="userType"]:checked').value;
            const data = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim(),
                role: userType,
                fullname: document.getElementById('fullname').value.trim(),
                email: document.getElementById('email').value.trim()
            };
            
            if (userType === 'student') {
                data.matricule = document.getElementById('matricule').value.trim();
                data.group_id = document.getElementById('studentGroup').value ? parseInt(document.getElementById('studentGroup').value) : 0;
            } else {
                data.professor_code = document.getElementById('professorCode').value.trim();
            }
            
            try {
                const result = await apiCall('register.php', 'POST', data);
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    document.getElementById('registerForm').reset();
                    // Reload groups dropdown
                    document.getElementById('studentGroup').innerHTML = '<option value="">Select Group</option>';
                    loadGroups();
                } else {
                    const errorMsg = result.errors ? result.errors.join(', ') : result.error;
                    showMessage(errorMsg, 'error');
                }
            } catch (error) {
                showMessage('Error registering user: ' + error.message, 'error');
            }
        });
        
        document.addEventListener('DOMContentLoaded', loadGroups);
    </script>
</body>
</html>
