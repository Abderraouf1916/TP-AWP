<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Admin</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="register.html" class="nav-link">Register Users</a></li>
                <li><a href="students.html" class="nav-link active">Students</a></li>
                <li><a href="professors.html" class="nav-link">Professors</a></li>
                <li><a href="statistics.html" class="nav-link">Statistics</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Student Management</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div style="margin-bottom: 2rem;">
                <a href="register.html" class="btn btn-primary">Register New Student</a>
                <button class="btn btn-secondary" onclick="exportStudents()">Export to Excel</button>
                <label for="importFile" class="btn btn-secondary" style="cursor: pointer; margin: 0;">
                    Import from Excel
                    <input type="file" id="importFile" accept=".xlsx,.xls" style="display: none;" onchange="importStudents(event)">
                </label>
            </div>
            
            
            <div id="loading" class="loading">Loading students...</div>
            <div id="studentsTable" style="display: none;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Matricule</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Group</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentsList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('admin')) {
            // Redirect will happen in requireLogin
        }
        let groups = [];
        
        async function loadGroups() {
            try {
                const result = await apiCall('groups.php');
                groups = result.data;
                
                // Populate edit modal group select
                const select = document.getElementById('edit_groupSelect');
                select.innerHTML = '<option value="">Select Group</option>';
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group.id;
                    option.textContent = `${group.group_code} - ${group.group_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }
        
        async function loadStudents() {
            try {
                const result = await apiCall('students.php');
                const students = result.data;
                
                document.getElementById('loading').style.display = 'none';
                
                if (students.length === 0) {
                    document.getElementById('studentsTable').innerHTML = '<p>No students found.</p>';
                    return;
                }
                
                let html = '';
                students.forEach(student => {
                    html += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${escapeHtml(student.matricule)}</td>
                            <td>${escapeHtml(student.fullname)}</td>
                            <td>${escapeHtml(student.email || '-')}</td>
                            <td>${escapeHtml(student.group_code || '-')}</td>
                            <td>
                                <button class="btn btn-primary" onclick="editStudent(${student.id})">Edit</button>
                                <button class="btn btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>`;
                });
                
                document.getElementById('studentsList').innerHTML = html;
                document.getElementById('studentsTable').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading students: ' + error.message, 'error');
            }
        }
        
        async function editStudent(id) {
            try {
                const result = await apiCall(`students.php?id=${id}`);
                const student = result.data;
                
                document.getElementById('edit_id').value = student.id;
                document.getElementById('edit_fullname').value = student.fullname;
                document.getElementById('edit_email').value = student.email || '';
                document.getElementById('edit_groupSelect').value = student.group_id || '';
                document.getElementById('editModal').style.display = 'block';
            } catch (error) {
                showMessage('Error loading student: ' + error.message, 'error');
            }
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;
            
            try {
                await apiCall(`students.php?id=${id}`, 'DELETE');
                showMessage('Student deleted successfully');
                loadStudents();
            } catch (error) {
                showMessage('Error deleting student: ' + error.message, 'error');
            }
        }
        
        document.getElementById('editStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                id: parseInt(document.getElementById('edit_id').value),
                fullname: document.getElementById('edit_fullname').value.trim(),
                email: document.getElementById('edit_email').value.trim(),
                group_id: document.getElementById('edit_groupSelect').value ? parseInt(document.getElementById('edit_groupSelect').value) : 0
            };
            
            try {
                await apiCall('students.php', 'PUT', data);
                showMessage('Student updated successfully');
                closeEditModal();
                loadStudents();
            } catch (error) {
                showMessage('Error updating student: ' + error.message, 'error');
            }
        });
        
        async function exportStudents() {
            try {
                const result = await apiCall('students.php');
                const students = result.data;
                
                const wsData = students.map(s => ({
                    'Matricule': s.matricule,
                    'Full Name': s.fullname,
                    'Email': s.email || '',
                    'Group': s.group_code || ''
                }));
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, 'Students');
                XLSX.writeFile(wb, 'students_export.xlsx');
                
                showMessage('Students exported successfully');
            } catch (error) {
                showMessage('Error exporting students: ' + error.message, 'error');
            }
        }
        
        async function importStudents(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet);
                
                let success = 0;
                let errors = 0;
                
                for (const row of jsonData) {
                    try {
                        const group = groups.find(g => g.group_code === row['Group']);
                        const matricule = String(row['Matricule'] || '');
                        const fullname = String(row['Full Name'] || '');
                        
                        // Use register API to create user account with default password
                        await apiCall('register.php', 'POST', {
                            username: matricule.toLowerCase().replace(/\s+/g, ''),
                            password: 'password', // Default password
                            role: 'student',
                            fullname: fullname,
                            email: String(row['Email'] || ''),
                            matricule: matricule,
                            group_id: group ? group.id : 0
                        });
                        success++;
                    } catch (error) {
                        errors++;
                        console.error('Error importing row:', row, error);
                    }
                }
                
                showMessage(`Import completed: ${success} successful, ${errors} errors`);
                loadStudents();
            } catch (error) {
                showMessage('Error importing file: ' + error.message, 'error');
            }
            
            event.target.value = '';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadGroups();
            loadStudents();
        });
    </script>
</body>
</html>
