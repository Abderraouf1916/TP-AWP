<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Admin</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="register.html" class="nav-link">Register Users</a></li>
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="professors.html" class="nav-link">Professors</a></li>
                <li><a href="statistics.html" class="nav-link active">Statistics</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Statistics & Charts</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div id="loading" class="loading">Loading statistics...</div>
            
            <div id="chartsContainer" style="display: none;">
                <div class="grid grid-2">
                    <div class="card">
                        <h3>Attendance by Course</h3>
                        <canvas id="courseChart"></canvas>
                    </div>
                    <div class="card">
                        <h3>Attendance by Group</h3>
                        <canvas id="groupChart"></canvas>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 1.5rem;">
                    <h3>Overall Attendance Distribution</h3>
                    <canvas id="attendanceChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('admin')) {
            // Redirect will happen in requireLogin
        }
        async function loadStatistics() {
            try {
                const result = await apiCall('statistics.php');
                const stats = result.data;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('chartsContainer').style.display = 'block';
                
                // Course Chart
                const courseCtx = document.getElementById('courseChart').getContext('2d');
                new Chart(courseCtx, {
                    type: 'bar',
                    data: {
                        labels: stats.by_course.map(c => c.course_code),
                        datasets: [{
                            label: 'Attendance Rate (%)',
                            data: stats.by_course.map(c => {
                                return c.total > 0 ? ((c.present / c.total) * 100).toFixed(1) : 0;
                            }),
                            backgroundColor: '#66BB6A'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
                
                // Group Chart
                const groupCtx = document.getElementById('groupChart').getContext('2d');
                new Chart(groupCtx, {
                    type: 'bar',
                    data: {
                        labels: stats.by_group.map(g => g.group_code),
                        datasets: [{
                            label: 'Attendance Rate (%)',
                            data: stats.by_group.map(g => {
                                return g.total > 0 ? ((g.present / g.total) * 100).toFixed(1) : 0;
                            }),
                            backgroundColor: '#4CAF50'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
                
                // Overall Attendance Chart
                const attendanceCtx = document.getElementById('attendanceChart').getContext('2d');
                new Chart(attendanceCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Present', 'Absent', 'Justified'],
                        datasets: [{
                            data: [
                                stats.attendance.present || 0,
                                stats.attendance.absent || 0,
                                stats.attendance.justified || 0
                            ],
                            backgroundColor: ['#66BB6A', '#dc3545', '#ffc107']
                        }]
                    },
                    options: {
                        responsive: true
                    }
                });
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading statistics: ' + error.message, 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadStatistics);
    </script>
</body>
</html>
