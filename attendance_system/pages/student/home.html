<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home - Attendance System</title>
    <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System - Student</h1>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link" onclick="logout(); return false;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>My Enrolled Courses</h2>
            <div id="message" class="message" style="display: none;"></div>
            
            <div id="loading" class="loading">Loading courses...</div>
            <div id="coursesContainer" class="grid grid-2"></div>
        </div>
    </main>

    <script src="../../assets/common.js"></script>
    <script src="../../assets/auth.js"></script>
    <script>
        // Check authentication
        if (!requireLogin('student')) {
            // Redirect will happen in requireLogin
        }
        
        const STUDENT_ID = getUserId();
        
        async function loadCourses() {
            try {
                const result = await apiCall(`courses.php?student_id=${STUDENT_ID}`);
                const courses = result.data;
                
                document.getElementById('loading').style.display = 'none';
                
                if (courses.length === 0) {
                    document.getElementById('coursesContainer').innerHTML = 
                        '<p>You are not enrolled in any courses.</p>';
                    return;
                }
                
                let html = '';
                courses.forEach(course => {
                    html += `
                        <div class="card">
                            <h3>${escapeHtml(course.course_code)}</h3>
                            <p><strong>${escapeHtml(course.course_name)}</strong></p>
                            <p>Group: ${escapeHtml(course.group_code)}</p>
                            <a href="attendance.html?course_id=${course.id}&group_id=${course.group_id}" class="btn btn-primary">View Attendance</a>
                        </div>`;
                });
                
                document.getElementById('coursesContainer').innerHTML = html;
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading courses: ' + error.message, 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadCourses);
    </script>
</body>
</html>
