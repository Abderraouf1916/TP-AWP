<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System</h1>
            <ul class="nav-menu">
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="sessions.html" class="nav-link active">Sessions</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Sessions Management</h2>
            
            <div id="message" style="display: none; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;"></div>
            
            <!-- Create Session Form -->
            <div style="margin-bottom: 2rem;">
                <h3>Create New Session</h3>
                <form id="createSessionForm" class="student-form">
                    <div class="form-group">
                        <label for="course_id">Course ID <span class="required">*</span></label>
                        <input type="text" id="course_id" name="course_id" required>
                    </div>
                    <div class="form-group">
                        <label for="group_id">Group ID <span class="required">*</span></label>
                        <input type="text" id="group_id" name="group_id" required>
                    </div>
                    <div class="form-group">
                        <label for="professor_id">Professor ID <span class="required">*</span></label>
                        <input type="text" id="professor_id" name="professor_id" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date <span class="required">*</span></label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Create Session</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>
            
            <!-- Sessions List -->
            <div>
                <h3>Sessions List</h3>
                <div id="sessionsList" style="text-align: center; padding: 2rem; color: #666;">
                    Loading...
                </div>
            </div>
        </div>
    </main>

    <script>
        // Set today's date as default
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            loadSessions();
        });

        // Create session form handler
        document.getElementById('createSessionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                course_id: document.getElementById('course_id').value.trim(),
                group_id: document.getElementById('group_id').value.trim(),
                professor_id: document.getElementById('professor_id').value.trim(),
                date: document.getElementById('date').value
            };
            
            try {
                const response = await fetch('api/sessions.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Session created successfully! Session ID: ' + result.session_id, 'success');
                    document.getElementById('createSessionForm').reset();
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                    loadSessions();
                } else {
                    showMessage(result.error || result.errors.join(', '), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        // Load sessions list
        async function loadSessions() {
            const listDiv = document.getElementById('sessionsList');
            listDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('api/sessions.php');
                const result = await response.json();
                
                if (result.success) {
                    const sessions = result.data;
                    
                    if (sessions.length === 0) {
                        listDiv.innerHTML = '<p>No sessions found. Create a session above.</p>';
                        return;
                    }
                    
                    let html = '<div class="table-wrapper"><table class="attendance-table"><thead><tr><th>Session ID</th><th>Course ID</th><th>Group ID</th><th>Date</th><th>Opened By</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                    
                    sessions.forEach(function(session) {
                        const statusColor = session.status === 'open' ? '#d4edda' : '#f8d7da';
                        const statusTextColor = session.status === 'open' ? '#155724' : '#721c24';
                        
                        html += `<tr>
                            <td>${session.id}</td>
                            <td>${escapeHtml(session.course_id)}</td>
                            <td>${escapeHtml(session.group_id)}</td>
                            <td>${escapeHtml(session.date)}</td>
                            <td>${escapeHtml(session.opened_by)}</td>
                            <td><span style="padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.9rem; background-color: ${statusColor}; color: ${statusTextColor};">${session.status.toUpperCase()}</span></td>
                            <td>`;
                        
                        if (session.status === 'open') {
                            html += `<button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem; background-color: #dc3545;" onclick="closeSession(${session.id})">Close</button>`;
                        } else {
                            html += '<span style="color: #999;">Closed</span>';
                        }
                        
                        html += '</td></tr>';
                    });
                    
                    html += '</tbody></table></div>';
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = '<p style="color: red;">Error loading sessions: ' + result.error + '</p>';
                }
            } catch (error) {
                listDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }

        // Close session
        async function closeSession(id) {
            if (!confirm('Are you sure you want to close this session?')) {
                return;
            }
            
            try {
                const response = await fetch('api/sessions.php', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: id,
                        status: 'closed'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Session closed successfully!', 'success');
                    loadSessions();
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            messageDiv.style.backgroundColor = type === 'success' ? '#d4edda' : '#f8d7da';
            messageDiv.style.color = type === 'success' ? '#155724' : '#721c24';
            
            setTimeout(function() {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
