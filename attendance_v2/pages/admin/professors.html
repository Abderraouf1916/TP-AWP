<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Professors</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Admin Dashboard</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="students.html" class="nav-link">Students</a></li>
                <li><a href="professors.html" class="nav-link active">Professors</a></li>
                <li><a href="assignments.html" class="nav-link">Course Assignments</a></li>
                <li><a href="users.html" class="nav-link">Users</a></li>
                <li><a href="#" class="nav-link" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Manage Professors</h2>
                <button class="btn btn-primary" onclick="showAddProfessorModal()">Add Professor</button>
            </div>

            <div id="professorsTable" class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Add Professor Modal -->
    <div class="modal" id="addProfessorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add New Professor</h3>
                <button class="modal-close" onclick="closeModal('addProfessorModal')">×</button>
            </div>
            <form id="addProfessorForm">
                <div class="form-group">
                    <label class="form-label">Professor Code <span class="required">*</span></label>
                    <input type="text" name="professor_code" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" name="fullname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Username <span class="required">*</span></label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addProfessorModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Professor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Professor Modal -->
    <div class="modal" id="editProfessorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Professor</h3>
                <button class="modal-close" onclick="closeModal('editProfessorModal')">×</button>
            </div>
            <form id="editProfessorForm">
                <input type="hidden" name="id" id="editProfessorId">
                <div class="form-group">
                    <label class="form-label">Professor Code <span class="required">*</span></label>
                    <input type="text" name="professor_code" id="editProfessorCode" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" name="fullname" id="editProfessorFullname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" id="editProfessorEmail" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Username <span class="required">*</span></label>
                    <input type="text" name="username" id="editProfessorUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="password" id="editProfessorPassword" class="form-control" placeholder="Leave blank to keep current password">
                    <small style="color: var(--text-secondary); font-size: 0.875rem;">Only fill this if you want to change the password</small>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('editProfessorModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Professor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        if (!requireAuth('admin')) {}

        async function loadProfessors() {
            const tableDiv = document.getElementById('professorsTable');
            tableDiv.innerHTML = '<div class="spinner"></div>';

            try {
                const result = await apiCall('professors.php');
                const professors = result.data;

                if (professors.length === 0) {
                    tableDiv.innerHTML = '<p>No professors found.</p>';
                    return;
                }

                let html = '<div class="table-container"><table class="table"><thead><tr>';
                html += '<th>Professor Code</th><th>Full Name</th><th>Email</th><th>Username</th><th>Actions</th>';
                html += '</tr></thead><tbody>';

                professors.forEach(professor => {
                    html += `<tr>
                        <td>${escapeHtml(professor.professor_code)}</td>
                        <td>${escapeHtml(professor.fullname)}</td>
                        <td>${escapeHtml(professor.email || '')}</td>
                        <td>${escapeHtml(professor.username || '')}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editProfessor(${professor.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProfessor(${professor.id})">Delete</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                tableDiv.innerHTML = html;
            } catch (error) {
                tableDiv.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
            }
        }

        async function deleteProfessor(id) {
            if (!confirm('Are you sure you want to delete this professor?')) return;

            try {
                await apiCall(`professors.php?id=${id}`, 'DELETE');
                showAlert('Professor deleted successfully');
                loadProfessors();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        function showAddProfessorModal() {
            showModal('addProfessorModal');
        }

        async function editProfessor(id) {
            try {
                const result = await apiCall(`professors.php?id=${id}`);
                const professor = result.data;
                
                if (!professor) {
                    showAlert('Professor not found', 'error');
                    return;
                }

                // Populate edit form
                document.getElementById('editProfessorId').value = professor.id;
                document.getElementById('editProfessorCode').value = professor.professor_code || '';
                document.getElementById('editProfessorFullname').value = professor.fullname || '';
                document.getElementById('editProfessorEmail').value = professor.email || '';
                document.getElementById('editProfessorUsername').value = professor.username || '';
                document.getElementById('editProfessorPassword').value = '';
                
                showModal('editProfessorModal');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        document.getElementById('editProfessorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Remove password if empty
            if (!data.password) {
                delete data.password;
            }

            try {
                await apiCall('professors.php', 'PUT', data);
                showAlert('Professor updated successfully');
                closeModal('editProfessorModal');
                this.reset();
                loadProfessors();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        document.getElementById('addProfessorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            try {
                await apiCall('professors.php', 'POST', data);
                showAlert('Professor added successfully');
                closeModal('addProfessorModal');
                this.reset();
                loadProfessors();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        loadProfessors();
    </script>
</body>
</html>
