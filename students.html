<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">Attendance System</h1>
            <ul class="nav-menu">
                <li><a href="students.html" class="nav-link active">Students</a></li>
                <li><a href="sessions.html" class="nav-link">Sessions</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="content">
            <h2>Students Management</h2>
            
            <div id="message" style="display: none; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;"></div>
            
            <!-- Add Student Form -->
            <div style="margin-bottom: 2rem;">
                <h3>Add New Student</h3>
                <form id="addStudentForm" class="student-form">
                    <div class="form-group">
                        <label for="fullname">Full Name <span class="required">*</span></label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="matricule">Matricule <span class="required">*</span></label>
                        <input type="text" id="matricule" name="matricule" required>
                    </div>
                    <div class="form-group">
                        <label for="group_id">Group ID <span class="required">*</span></label>
                        <input type="text" id="group_id" name="group_id" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Add Student</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>
            
            <!-- Students List -->
            <div>
                <h3>Students List</h3>
                <div id="studentsList" style="text-align: center; padding: 2rem; color: #666;">
                    Loading...
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
            <h3>Edit Student</h3>
            <form id="editStudentForm">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label for="edit_fullname">Full Name <span class="required">*</span></label>
                    <input type="text" id="edit_fullname" required>
                </div>
                <div class="form-group">
                    <label for="edit_matricule">Matricule <span class="required">*</span></label>
                    <input type="text" id="edit_matricule" required>
                </div>
                <div class="form-group">
                    <label for="edit_group_id">Group ID <span class="required">*</span></label>
                    <input type="text" id="edit_group_id" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Update</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Load students on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
        });

        // Add student form handler
        document.getElementById('addStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                fullname: document.getElementById('fullname').value.trim(),
                matricule: document.getElementById('matricule').value.trim(),
                group_id: document.getElementById('group_id').value.trim()
            };
            
            try {
                const response = await fetch('api/students.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Student added successfully!', 'success');
                    document.getElementById('addStudentForm').reset();
                    loadStudents();
                } else {
                    showMessage(result.error || result.errors.join(', '), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        // Load students list
        async function loadStudents() {
            const listDiv = document.getElementById('studentsList');
            listDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('api/students.php');
                const result = await response.json();
                
                if (result.success) {
                    const students = result.data;
                    
                    if (students.length === 0) {
                        listDiv.innerHTML = '<p>No students found. Add a student above.</p>';
                        return;
                    }
                    
                    let html = '<div class="table-wrapper"><table class="attendance-table"><thead><tr><th>ID</th><th>Full Name</th><th>Matricule</th><th>Group ID</th><th>Actions</th></tr></thead><tbody>';
                    
                    students.forEach(function(student) {
                        html += `<tr>
                            <td>${student.id}</td>
                            <td>${escapeHtml(student.fullname)}</td>
                            <td>${escapeHtml(student.matricule)}</td>
                            <td>${escapeHtml(student.group_id)}</td>
                            <td>
                                <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.9rem; margin-right: 0.5rem;" onclick="editStudent(${student.id})">Edit</button>
                                <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem; background-color: #dc3545;" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div>';
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = '<p style="color: red;">Error loading students: ' + result.error + '</p>';
                }
            } catch (error) {
                listDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }

        // Edit student
        async function editStudent(id) {
            try {
                const response = await fetch(`api/students.php?id=${id}`);
                const result = await response.json();
                
                if (result.success) {
                    const student = result.data;
                    document.getElementById('edit_id').value = student.id;
                    document.getElementById('edit_fullname').value = student.fullname;
                    document.getElementById('edit_matricule').value = student.matricule;
                    document.getElementById('edit_group_id').value = student.group_id;
                    document.getElementById('editModal').style.display = 'block';
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Update student form handler
        document.getElementById('editStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                id: parseInt(document.getElementById('edit_id').value),
                fullname: document.getElementById('edit_fullname').value.trim(),
                matricule: document.getElementById('edit_matricule').value.trim(),
                group_id: document.getElementById('edit_group_id').value.trim()
            };
            
            try {
                const response = await fetch('api/students.php', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Student updated successfully!', 'success');
                    closeEditModal();
                    loadStudents();
                } else {
                    showMessage(result.error || result.errors.join(', '), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        // Delete student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }
            
            try {
                const response = await fetch(`api/students.php?id=${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Student deleted successfully!', 'success');
                    loadStudents();
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            messageDiv.style.backgroundColor = type === 'success' ? '#d4edda' : '#f8d7da';
            messageDiv.style.color = type === 'success' ? '#155724' : '#721c24';
            
            setTimeout(function() {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
